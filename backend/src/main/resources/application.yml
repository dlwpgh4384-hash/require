server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    import: optional:file:./config/application-local.yml
  application:
    name: navigation-shell
  servlet:
    multipart:
      max-file-size: 10000000B
      max-request-size: 11000000B
  # 내 PC 개발 DB 기본값(2026-11-16 사용자 결정, 개발 기간 시험용). 환경 변수 DB_URL·DB_USER·DB_PASSWORD가 있으면 그것을 쓴다
  # (미리보기는 docker가 환경 변수를 넣으므로 이 값을 쓰지 않는다). 운영 전에 기본값은 지운다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:rlfls#001}
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: always
# SER-005 거래처 계좌번호 암호화 키(Base64 32바이트). 환경 변수 PAYMENT_ACCOUNT_KEY가 있으면 그것을 쓴다.
# 아래 값은 개발용 임시 키다(2026-11-14 사용자 결정). 운영 전에 환경 변수로 옮기고 이 값은 지운다.
payment:
  account-key: ${PAYMENT_ACCOUNT_KEY:C3tOITc4O3LDsDQ0qr5HNdtBYKcs/edYUREesqrtI8A=}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    auto-mapping-unknown-column-behavior: FAILING
# 공통 메일(미수 알림·임시 비밀번호·인증번호). 앱은 smtp.* 한 곳에서만 읽는다.
# 읽는 순서: 환경 변수 SMTP_HOST·SMTP_PORT·SMTP_USERNAME·SMTP_PASSWORD > 앱이 도는 곳 옆 config/application-local.yml
#   (git에 안 올림, 예전 키 spring.mail.host·port·username·password도 읽음) > 아래 기본값(주소·포트만).
# 아이디·비밀번호는 여기에 두지 않는다. 비밀번호가 없으면 보내지 않고 앱 임시 폴더 billing-mail에 .eml로 쓴다(개발·시험용).
# 보내는 주소는 BILLING_MAIL_FROM 또는 billing.mail.from(없으면 SMTP 아이디).
smtp:
  host: ${SMTP_HOST:${spring.mail.host:smtp-relay.brevo.com}}
  port: ${SMTP_PORT:${spring.mail.port:587}}
  username: ${SMTP_USERNAME:${spring.mail.username:}}
  password: ${SMTP_PASSWORD:${spring.mail.password:}}
billing:
  mail:
    from: ${BILLING_MAIL_FROM:}
# UI-26 AI 분석 도우미 외부 AI 연결 자리. 값은 환경 변수로만 넣는다(여기에는 빈 기본값만).
# 키가 없으면 외부 호출 없이 규칙으로 답한다.
ai:
  api-url: ${AI_API_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:}
