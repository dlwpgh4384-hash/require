server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: navigation-shell
  servlet:
    multipart:
      max-file-size: 10000000B
      max-request-size: 11000000B
  # 내 PC 개발 DB 기본값(2026-11-16 사용자 결정, 개발 기간 시험용). 환경 변수 DB_URL·DB_USER·DB_PASSWORD가 있으면 그것을 쓴다
  # (미리보기는 docker가 환경 변수를 넣으므로 이 값을 쓰지 않는다). 운영 전에 기본값은 지운다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:rlfls#001}
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: always
# SER-005 거래처 계좌번호 암호화 키(Base64 32바이트). 환경 변수 PAYMENT_ACCOUNT_KEY가 있으면 그것을 쓴다.
# 아래 값은 개발용 임시 키다(2026-11-14 사용자 결정). 운영 전에 환경 변수로 옮기고 이 값은 지운다.
payment:
  account-key: ${PAYMENT_ACCOUNT_KEY:C3tOITc4O3LDsDQ0qr5HNdtBYKcs/edYUREesqrtI8A=}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    auto-mapping-unknown-column-behavior: FAILING
