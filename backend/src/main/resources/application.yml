server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    import: optional:file:./config/application-local.yml
  application:
    name: navigation-shell
  servlet:
    multipart:
      max-file-size: 10000000B
      max-request-size: 11000000B
  # 내 PC 개발 DB 기본값(2026-11-16 사용자 결정, 개발 기간 시험용). 환경 변수 DB_URL·DB_USER·DB_PASSWORD가 있으면 그것을 쓴다
  # (미리보기는 docker가 환경 변수를 넣으므로 이 값을 쓰지 않는다). 운영 전에 기본값은 지운다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:rlfls#001}
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: always
# SER-005 거래처 계좌번호 암호화 키(Base64 32바이트). 환경 변수 PAYMENT_ACCOUNT_KEY가 있으면 그것을 쓴다.
# 아래 값은 개발용 임시 키다(2026-11-14 사용자 결정). 운영 전에 환경 변수로 옮기고 이 값은 지운다.
payment:
  account-key: ${PAYMENT_ACCOUNT_KEY:C3tOITc4O3LDsDQ0qr5HNdtBYKcs/edYUREesqrtI8A=}
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    auto-mapping-unknown-column-behavior: FAILING
# UI-13 미수 알림 메일. SMTP는 운영자가 환경 변수로만 넣는다(값은 여기에 두지 않는다):
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, BILLING_MAIL_FROM(보내는 주소)
# SPRING_MAIL_HOST와 BILLING_MAIL_FROM이 모두 있어야 실제 메일을 보내고, 없으면 앱 임시 폴더 billing-mail에 .eml로 쓴다.
billing:
  mail:
    from: ${BILLING_MAIL_FROM:}
# UI-26 AI 분석 도우미 외부 AI 연결 자리. 값은 환경 변수로만 넣는다(여기에는 빈 기본값만).
# 키가 없으면 외부 호출 없이 규칙으로 답한다.
ai:
  api-url: ${AI_API_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:}
