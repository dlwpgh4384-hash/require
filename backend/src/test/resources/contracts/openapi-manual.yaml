              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '상세 modifiedAt 불일치: 다른 사람이 먼저 바꿨습니다. 다시 불러와 주세요. 기존 배정·이력은 불변이다.'
          content:
            application/json:
              schema:
