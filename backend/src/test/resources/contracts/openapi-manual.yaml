      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonAssignmentInput'
      x-business-rules:
      - 프로젝트·개발자·직무·투입일·철수일·월 MM을 받아 TB_PJ_ASGN에 등록한다. 월 MM 기본 1.00이다.
      - 이름/관리번호 검색 결과 옆에 대기·투입 중 ~마지막 철수일·휴직만 표시한다.
      - 종료·실주 프로젝트를 제외하고 철수일이 프로젝트 계약 종료일 또는 개발자 퇴사일보다 늦으면 지정 문구로 거부한다.
      - 최초 투입일은 오늘·철수일은 기본 프로젝트 종료일이고 프로젝트 변경 시 계약 시작일~종료일로 바꾼다. AI 진입은 max(추천 시작월1일, 프로젝트 시작일)~종료일이다.
      - 내부가 아닌 사람/프로젝트 영업 파트 차이는 원문 긴 안내를 보이고 저장 허용하며 매출·사람 이익 귀속을 설명한다.
      - 월단위·파견 유상 배정은 청구 단가 >0 필수다. PM은 기본 월 단가를 쓰고 없으면 지정 문구로 거부하며 파트장·재무는 직접 입력한다.
      - 배정 저장 시 TB_PJ_ASGN_HIST에 투입 1줄을 자동 기록한다.
      - 투입 구분은 신규·추가투입·대체투입·무상지원이며 기본 신규다. 청구 단가는 월단위·파견만, 무상지원은 숨기고 0 저장한다. 연장 가능성은 입력 없이 미정이다.
      - 대체투입 계약상 인력은 같은 프로젝트 배정 이력 인력을 사람당 1줄·본인 제외·철수일 표시로 조회한다.
      - 월단위·파견은 계약상 인력 마지막 배정 최근 월 단가를 채우고 턴키·내부는 이름만 표시한다. 프로젝트/구분 변경 또는 본인 일치 시 선택을 비운다.
      - 투입일에 걸친 계약상 인력 배정을 기본 전체 체크로 표시하고 같이 처리·대체투입만 저장·취소를 선택하게 한다. 겹침 없으면 바로 저장한다.
      - 같이 처리 시 선택된 원배정을 투입일 전날로 조기 철수하며 사유 ASGN_CHG_RSN 필수·기본값 없음·메모 200자 기본 대체투입(실제 투입자)을 받는다.
      - 같이 처리된 각 원배정에 조기 철수 이력과 ASGN_CHG_RSN_CD·CHG_MEMO를 남기고 인력 사정은 식-70 성과 점수 원천에 포함한다.
      - 계산 배분표에 계약상 인력 줄이 있으면 확인창과 저장 안내에 재업로드·배분 불일치 문구를 보이고 배분표를 자동 변경하지 않는다.
      - PM에게 청구 단가 입력을 숨기고 기본값으로 저장하며 단가 직접 수정은 파트장·재무로 한정하는 정책 함수를 보존한다. 로그인/메뉴 통제는 후속이다.
      - 수주예정 선투입·휴직 중 배정·파견 프리랜서/외주·마감월 걸침을 경고하되 저장을 허용한다.
      x-side-effects:
      - TB_PJ_ASGN 신규와 TB_PJ_ASGN_HIST 투입1줄을 같은 트랜잭션에 저장한다.
      - together 선택 시 체크 원배정 종료일=투입일 전날 및 각 조기 철수 이력·ASGN_CHG_RSN_CD·CHG_MEMO를 같은 경계에 기록한다.
      - 배분표는 자동 변경하지 않고 재업로드 안내·프로젝트 집계를 갱신한다. TB_CO_PREV_ADJ 자동 행 생성은 없다.
      x-required-tests:
      - 'happy: 월 MM 1.00의 유효 배정 저장 -> getCommonAssignment에서 같은 프로젝트·개발자·기간·monthlyMm 재조회'
      - 'auth: PM 정책 fixture의 임의 청구 단가 입력 -> 해당 입력 사용 거부·기본 단가만 저장; 현재 무인증 HTTP는 200·admin'
      - 'validation: 개발자 누락 -> 400 errors.developerId에 개발자를 골라 주세요·TB_PJ_ASGN 추가0'
      - 'business: 철수일이 계약 종료일 또는 퇴사일 초과 -> 400 endDate 오류·기존 배정 불변'
      - 'side-effect: together와 철수 사유 제출 -> 선택 원배정 전날 종료·조기 철수 이력 및 새 투입 이력 조회'
      - 'business: 함께 처리 사유 누락 -> 400 reasonCode에 철수 사유를 골라 주세요·신규/원배정 전체 불변'
      - 'business: 무상지원·PM 기본 단가 없음 -> 200 billingPrice=0·유상 PM은 지정 월 단가 없음 오류'
      - 'side-effect: 턴키 대체 등록 -> 배분표 원행 불변·재업로드 안내와 불일치 재조회'
      x-state-transitions:
      - 없음 -> 유효 배정·투입 이력
      - 선택 원배정 -> 조기 철수(together만); assignment-only는 원배정 유지
