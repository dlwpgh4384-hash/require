              $ref: '#/components/schemas/UserPreferenceInput'
      x-business-rules:
      - FAV JSON 배열은 최대 10개, RECENT는 최대 5개다. 한도를 넘긴 요청을 저장하지 않는다.
      - PAGE_SIZE는 20/50/100, DENSE는 넓게/좁게, MENU_FOLD는 true/false, AMT_UNIT은 원/천 원/백만 원 문자열이다. PERIOD는 year 및 월형의 month를 직렬화한다.
      - PERIOD의 허용 연도·최신 월 판정은 부품 입력과 최신 월 원천을 따르며 이 API가 업무 자료 연도를 조회하지 않는다.
      - 기존 행은 읽은 MOD_DTTM과 DB 시각이 같은 경우에만 갱신한다. 다른 시각은 덮어쓰지 않는다.
      x-side-effects:
      - TB_SY_USER_PREF 신규 행은 REG_USER_ID=admin·REG_DTTM, 갱신은 MOD_USER_ID=admin·MOD_DTTM을 기록하고 다음 GET으로 읽힌다.
      - 업무 감사·알림 행은 생성하지 않는다. 화면 설정 반영·3초 완료 알림은 성공을 소비한 UI의 책임이다.
      x-state-transitions:
      - from: 행 없음
        to: 저장 행
        condition: 유효한 설정 최초 저장
      - from: 기존 PREF_VAL
        to: 새 PREF_VAL
        condition: 유효 입력·MOD_DTTM 일치
      - from: 기존 PREF_VAL
        to: 기존 PREF_VAL
        condition: 입력 오류·한도 초과·MOD_DTTM 불일치
      x-required-tests:
      - 'happy: 기존 admin/PAGE_SIZE/GLOBAL과 읽은 modDttm으로 prefVal=50 저장 -> 200이며 후속 GET과 TB_SY_USER_PREF.PREF_VAL이 문자열
        50이다.'
      - 'auth: 인증 헤더 없이 admin/MENU_FOLD/GLOBAL 유효 설정 저장 -> 로그인·역할 검사 없이 200이며 GET에서 변경값이 읽힌다. 이번 요청은 로그인·권한을 제외하므로
        근거 없는 401·403 거부 시험을 만들지 않는다.'
      - 'validation: PAGE_SIZE/GLOBAL에 prefVal=30 저장 -> 400 ApiError.errors의 prefVal 필드 오류이며 기존 PAGE_SIZE 값은 그대로다.'
      - 'business: 기존 행의 읽은 modDttm과 DB MOD_DTTM이 다른 채 저장 -> 409와 다른 사람이 먼저 바꿨습니다. 다시 불러와 주세요.이며 PREF_VAL은 DB 최신값
        그대로다.'
      - 'side-effect: 기존 MENU_FOLD 행을 읽은 modDttm으로 변경 저장 -> TB_SY_USER_PREF.MOD_USER_ID=admin·MOD_DTTM 갱신이 DB에 있고
        다음 GET.modDttm과 같다.'
      responses:
        '200':
          description: 저장한 설정과 수정 시각
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferenceResponse'
        '400':
          description: 종류·키·직렬화·허용값·길이·목록 한도 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 읽은 시각과 다른 기존 행. 기존 값은 보존한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
