      - PERIOD의 허용 연도·최신 월 판정은 부품 입력과 최신 월 원천을 따르며 이 API가 업무 자료 연도를 조회하지 않는다.
      - 기존 행은 읽은 MOD_DTTM과 DB 시각이 같은 경우에만 갱신한다. 다른 시각은 덮어쓰지 않는다.
