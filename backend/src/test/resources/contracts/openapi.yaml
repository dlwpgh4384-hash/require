      responses:
        '200':
          description: 프로젝트 원가 분석 조회 공개 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CommonProjectCostAnalysisResult'
        '400':
          description: year/baseMonth 누락·월1~12 밖·가장 최근 달 뒤/CASH_BASE_YM 앞·조건 형식/코드 오류·그 달 대상이 아닌 projectId; ApiError.errors[].field는 해당 입력명. 미정 업무 상한을 발명하지 않는다.
