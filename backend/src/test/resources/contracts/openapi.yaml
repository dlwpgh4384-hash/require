        filtering: year 필수, projectId·differenceStatus 선택; 차이는 계산 후 필터
        ordering: 차이 오름차순으로 부족 큰 순; 동순위 보조 기준은 OQ-QUERY-011
        totals: 현재 조회 조건 전체 행의 합계; 필터 전 합계 여부는 OQ-QUERY-011 리뷰 확인
      x-business-rules:
