components:
  schemas:
    CommonManpowerForecastMonth:
      type: object
      properties:
        month:
          type: string
          pattern: ^\d{4}-\d{2}$
          description: 조회 월 yyyy-MM
        supply:
          type: number
          description: 공통 계산의 가용 인력 MM
        demand:
          type: number
          description: 영업확률 반영 필요+진행 미충원 MM
        unfilledDemand:
          type: number
          description: demand에 이미 포함된 진행 프로젝트 미충원 몫
        difference:
          type: number
          description: 한 자리(HALF_UP)로 반올림한 supply − 한 자리로 반올림한 demand(소수 첫째 자리 값)
      required:
      - month
      - supply
      - demand
      - unfilledDemand
      - difference
    CommonManpowerForecastJobShortage:
      type: object
      nullable: true
      description: 기간전체 직무별 최소 가용−필요가 −0.05 미만인 직무 중 최저 직무. 없으면 null. 동률은 OQ-JOB-017.
      properties:
        jobName:
          type: string
          description: JOB 표시명; 코드 원문을 화면에 노출하지 않는다.
        maximumShortage:
          type: number
          description: 직무·달마다 한 자리로 반올림한 가용−필요의 기간 최솟값의 절댓값(소수 첫째 자리); 최대 n명 부족 표시용 양수
      required:
      - jobName
      - maximumShortage
    CommonManpowerForecastSummary:
      type: object
      properties:
        lastMonthSupply:
          type: number
          description: 조회 마지막 달 가용 인력
        lastMonthDemand:
          type: number
          description: 조회 마지막 달 필요 인력
        mostShortage:
          $ref: '#/components/schemas/CommonManpowerForecastJobShortage'
      required:
      - lastMonthSupply
      - lastMonthDemand
      - mostShortage
    CommonManpowerForecastThresholds:
      type: object
      description: TB_SY_OPER_STD의 현재 공통 계산이 적용한 운영 기준값; UI에 고정 상수로 복제하지 않는다.
      properties:
        shortageThreshold:
          type: number
          description: 부족 초과 경계; 원문 기준0.4명
        surplusThreshold:
          type: number
          description: 남음 초과 경계; 원문 기준1명
      required:
      - shortageThreshold
      - surplusThreshold
    CommonManpowerForecastResult:
      type: object
      properties:
        months:
          type: array
          description: 올해 이번달~12월 또는 내년1~12월.
          items:
            $ref: '#/components/schemas/CommonManpowerForecastMonth'
        summary:
          $ref: '#/components/schemas/CommonManpowerForecastSummary'
        thresholds:
          $ref: '#/components/schemas/CommonManpowerForecastThresholds'
      required:
      - months
      - summary
      - thresholds
    CommonManpowerBoardSummary:
      type: object
      properties:
        idleCount:
          type: integer
          description: 지금 비어 있는 인원
        availableMm:
          type: number
          description: 현재 남는 MM·일부 투입 포함
        withdrawalCount:
          type: integer
          description: 3개월 안 철수 예정
        highExtensionCount:
          type: integer
          description: 연장 가능성 높음 인원
        concurrentCount:
          type: integer
          description: 이번달 두건 이상
        overAllocatedCount:
          type: integer
          description: 이번달 합계1.0 초과
        futureAvailableMm:
          type: number
          description: 3개월 뒤 남는 MM·예측
      required:
      - idleCount
      - availableMm
      - withdrawalCount
      - highExtensionCount
      - concurrentCount
      - overAllocatedCount
      - futureAvailableMm
    CommonManpowerBoardProject:
      type: object
      properties:
        projectName:
          type: string
        monthlyMm:
          type: number
          description: 해당 프로젝트 월 MM
      required:
      - projectName
      - monthlyMm
    CommonManpowerBoardCell:
      type: object
      properties:
        month:
          type: string
          pattern: ^\d{4}-\d{2}$
        statusCode:
          type: string
          enum:
          - 'on'
          - end
          - idle
          - tent
          - leave
          - ret
          - pre
          - none
          description: 칸 상태 키(시안 cellInfo). on 투입 중(일부·동시 포함)·end 철수 예정·idle 비어 있음·tent 가배정·leave 휴직·ret 퇴사·pre 미계약 선투입·none –
        statusName:
          type: string
          description: 투입 중·일부 투입·동시 투입·철수 예정·비어 있음·가배정·휴직·퇴사·미계약 선투입·–의 표시명
        totalMm:
          type: number
          description: 프로젝트별 MM 합계; 1.0 초과 별도표시. tent·leave·ret·none은 0
        projects:
          type: array
          description: 그 달 확정 투입의 프로젝트별 MM. tent·leave·ret·none은 빈 목록
          items:
            $ref: '#/components/schemas/CommonManpowerBoardProject'
        extensionPossibilityName:
          type: string
          nullable: true
          description: 철수 예정(end) 칸만, 끝나는 투입의 연장 가능성 표시명(높음·보통·낮음, 여럿이면 가장 높은 것); 그 밖은 null
        winningProbability:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: 진행ACT 가배정일 때 확률; 없으면 null
        tentative:
          type: boolean
          description: 진행ACT 기회의 해당월 가배정 점선
      required:
      - month
      - statusCode
      - statusName
      - totalMm
      - projects
      - extensionPossibilityName
      - winningProbability
      - tentative
