  /api/common/manpower-comparisons:
    get:
      operationId: getCommonManpowerComparisons
      summary: 인원 계획 대비 투입 조회
      description: >-
        UI-11의 조회 전용 비교다. 선택 연도에 수행 기간이 걸친 프로젝트마다
        계획 직무와 투입 직무의 합집합을 만들고 누락 계획/투입은 각각 0으로 본다.
        실제는 해당 연도 1~12월 월 MM의 실적과 예정 합이다.
        계획은 UI-01 저장 원계획을 해당 연도 프로젝트 개월 수/전체 개월 수로 안분하고
        소수 둘째 자리 반올림한다. 차이는 실제-계획이며 정확히0만 맞음이다.
        프로젝트 기간 일부 월의 개월 수 산정은 DB 식-00/식-67을 따른다(OQ-CALC-011).
        현재 로그인/메뉴권한 연결은 하지 않는다. GET은 업무 쓰기/DDL/seed를 실행하지 않는다.
      security: []
      x-related-requirements:
      - REQ-578
      - REQ-587
      - REQ-589
      - REQ-590
      - REQ-591
      - REQ-592
      - REQ-593
      - REQ-596
      x-aiops-query-role:
        entity: TB_PJ_MNPW_PLAN
        result_path: [data, items]
      x-pagination-filtering:
        pagination: 조건에 맞는 전체 결과; 서버 페이지 파라미터 없음
        filtering: year 필수, projectId·differenceStatus 선택; 차이는 계산 후 필터
        ordering: 차이 오름차순으로 부족 큰 순; 동순위 보조 기준은 OQ-QUERY-011
        totals: 현재 조회 조건 전체 행의 합계; 필터 전 합계 여부는 OQ-QUERY-011 리뷰 확인
      x-business-rules:
      - 'REQ-592: 선택 연도와 프로젝트 수행 기간이 겹친 경우만 비교하며 수행 상태로 추가 제외하지 않는다.'
      - 'REQ-589: 계획 직무 ∪ 투입 직무를 행으로 만들고 계획 없는 양수투입은 계획0·초과, 투입 없는 양수계획은 실제0·부족이며 합계에 포함한다.'
      - 'REQ-591: 차이=actualMm-plannedMm; <0 부족, >0 초과, =0 맞음. 허용 오차를 두지 않는다.'
      - 'REQ-593: 연도 몫은 UI-01 원계획×연도겹침개월/전체개월이며 소수 둘째 자리 반올림, 시안 가짜값 사용 금지다.'
      x-side-effects:
      - 'REQ-596: TB_PJ_MNPW_PLAN·TB_PJ_ASGN_MON 업무 쓰기 없음; 조회 결과를 물리 표로 저장하지 않는다.'
      x-required-tests:
      - 'happy: 연도겹침 프로젝트의 계획/투입 직무가 다른 fixture로 year=2026 조회 -> 200 data.items에 두 직무 모두 있고 누락 MM은0이며 data.totals는 같은 결과의 합이다.'
      - 'auth: 인증 헤더 없이 유효 year로 조회 -> 200 success=true·meta·data.items가 반환되고 로그인 이동/401/403은 없다.'
      - 'validation: year 누락 또는 2025~2027 밖, differenceStatus가 세 상태 밖인 요청 -> 400 ApiError.errors에 year 또는 differenceStatus 필드 오류가 있다.'
      - 'business: 월 MM의 실제/예정과 다른 연도 자료가 있는 fixture 조회 -> actualMm은 선택 연도 1~12월 합이고 다른 연도는 제외되며 차이0만 맞음이다.'
      - 'side-effect: 정상/0건 조회 전후 원천 snapshot 비교 -> TB_PJ_MNPW_PLAN·TB_PJ_ASGN_MON 행과 값이 같고 비교결과 저장행이 생성되지 않는다.'
      - 'scope: 선택 연도와 수행 기간이 겹치지 않는 프로젝트를 가진 fixture 조회 -> 해당 projectId는 items에 없고 합계에도 포함되지 않는다.'
      - 'annual-plan: UI-01 원계획·여러해 수행기간·확보된 DB식 fixture 조회 -> plannedMm이 그 해 개월비율 안분의 소수 둘째 자리 반올림과 같다; 미제공 절대수치는 OQ-CALC-011이다.'
      - 'empty: 조건 일치0건 조회 -> 200 data.items=[]이고 세 totals MM이0이다; 오류를 정상 빈 결과로 바꾸지 않는다.'
      parameters:
      - name: year
        in: query
        required: true
        schema:
          type: integer
          minimum: 2025
          maximum: 2027
        description: 조회 연도; 지난 해도 읽기 전용
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: 기존 프로젝트 식별자; 생략하면 연도 범위 전체
      - name: differenceStatus
        in: query
        required: false
        schema:
          type: string
          enum: [부족, 초과, 맞음]
        description: 파생 차이 상태; 미등록 상태 없음
      responses:
        '200':
          description: 프로젝트·직무별 연간 비교 행과 현재 조회 결과 합계
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/CommonManpowerComparisonResult'
        '400':
          description: year 누락/형식/범위 또는 differenceStatus 허용값 오류; 해당 필드 오류 반환, 업무표 무변경
