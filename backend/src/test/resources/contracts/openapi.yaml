    REQ-022: '응답 소비 UI — SCRN_ID·자식 혼합 행 클릭은 자기 화면 이동 없이 자식 토글. 직접 주소 취급 OQ-005.'
    REQ-023: '서버 부수 효과 — 혼합 메뉴 조회 뒤 경고 관찰. 추가 감사 저장 금지.'
    REQ-024: '서버 대표 결정 — 전체 후보 SORT_ORD/MENU_ID 순 첫 중복 행 조건 적용. 중지 첫 행 대신 뒤 행 승격 금지, 원본 보존. 직접 주소 전달 OQ-005.'
    REQ-025: '서버 부수 효과 — 중복 SCRN_ID 조회 뒤 경고 관찰. UNIQUE 추가·중복 삭제 대체 금지.'
    REQ-026: '응답 소비 UI — 즐겨찾기·최근 본 화면·화면 탭·상단 도구줄·단축키·알림 여섯 자리 준비 중·비활성 검수. 임시 데이터·작동 연출 금지.'
