  /api/common/project-cost-analyses/{projectId}/causes:
    get:
      operationId: getCommonProjectCostAnalysisCauses
      summary: 프로젝트 원가 초과 원인
      security: []
      description: 프로젝트 원가 초과 원인. 현재 개발 admin·로그인/메뉴검사는 UI-22 후속. 업무 원자료/분석 결과는 저장하지 않는다. 마감월은 저장값, 미마감월은 해당월 유효 이력과
        현재자료. 정확한 물리매핑/식은 OQ-DATA/CALC-004로 국소 대조.
      x-related-requirements:
      - REQ-811
      - REQ-819
      - REQ-820
      - REQ-821
      - REQ-822
      - REQ-823
      parameters:
      - name: projectId
        in: path
        required: true
        description: 선택 프로젝트 기존 식별자
        schema:
          type: string
      - name: year
        in: query
        required: true
        description: 선택 연도·기존 YearBar 범위
        schema:
          type: integer
      - name: baseMonth
        in: query
        required: true
        description: 기준월·초기 한국 이번 달
        schema:
          type: integer
          minimum: 1
          maximum: 12
      x-business-rules:
      - 계획 MM은 TB_PJ_MNPW_PLAN.PLAN_MM 직무별 합계를 그대로 읽는다. 계획이 없으면 계획 없음으로 표시하고 투입 초과 원인을 계산하지 않는다.
      - 원인은 월별 실제 금액 합으로 금액 큰 순에 표시한다. 턴키에는 진척 대비 초과 금액과 세 원인으로 설명 안 되는 나머지 문구를 함께 보여 준다.
      - 각 원인마다 할 일과 이동 버튼을 제공한다. PM 할 일은 UI-11, 파트장은 UI-32에서 수행하며 이 화면의 고칠 사람 표기는 안내다. 다른 화면 전체를 이번에 활성화하지 않는다.
      - 경보(저마진·예산 초과)가 있거나 턴키 진척 대비 원가 초과인 경우에만 주원인 막대를 빨강으로 표시한다. 그 외 회색과 경보가 없는 프로젝트라 참고용 문구를 표시한다.
      - 원인 분석 열람은 화면과 같이 재무·경영진·관리자만 허용하는 정책으로 보존한다. 현재 고정 admin 및 UI-22 전 검사 미연결 경계는 유지한다.
      - PM에게 원가·이익 금액을 노출하지 않는다. PM은 기존 UI-31 진척률·원가 사용률을 이용한다.
      x-side-effects:
      - 업무 원자료·마감·계약·투입·분석 결과 쓰기0.
      x-pagination-filtering:
        pagination: 조건 일치 전체를 반환·서버 page 없음·ListView 기존 로컬 페이지
        filtering: year/baseMonth·path projectId의 기준월 대상만
        ordering: 원인 amount 내림차순
      responses:
        '200':
          description: 프로젝트 원가 초과 원인 공개 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CommonProjectCostAnalysisCauses'
        '400':
          description: year/baseMonth 누락·월1~12 밖·조건 형식/코드 오류; ApiError.errors[].field는 해당 입력명. 미정 업무 상한을 발명하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 선택 projectId가 존재하지 않음·다른 프로젝트 결과를 반환하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
