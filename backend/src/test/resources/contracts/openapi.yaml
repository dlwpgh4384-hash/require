x-requirement-context:
  description: >-
    아래 항목은 관련 요구별 역할·관찰 증거다. 면제 목록이 아니다.
    서버 조회, 응답 소비 UI, 실행 전 준비, 실행 제약과 범위 경계를 구분한다.
    요구 의미는 requirement-registry.json의 title·statement·acceptance_hint·source_locator가 기준이며
    연결 자체를 구현 완성 증거로 취급하지 않는다.
  getCommonMenus:
    REQ-001: '응답 소비 UI — 단일 AppLayout 안 Sidebar·Header·본문 각 하나. 이동 전후 단일 구조 검수.'
    REQ-002: '응답 소비 UI — 선택 SCRN_ID를 공통 본문에 배치, 초기30개 미구현 본문 준비 중. 업무 결과 반환 없음.'
    REQ-003: '응답 소비 UI — Header는 후속 제목·버튼 자리만 제공. 가짜 사용자 이름·알림 건수 미표시 검수.'
    REQ-004: '응답 소비 UI — PC 기본 펼침·휴대폰 폭 접기/펼치기 검수. 폭 수치는 OQ-003이며 서버 입력 아님.'
    REQ-005: '서버 조회 — 실제 TB_SY_MENU의 이름·순서 반영 검수. 고정 메뉴 배열 대체 금지.'
    REQ-006: '서버 조회 — USE_YN=Y·UPPER_MENU_ID 계층·SORT_ORD/MENU_ID 정렬 및 중지 후손 제외. 검색·페이지는 OQ-007.'
    REQ-007: '서버 응답 — HTTP200·공개8필드 목록·0건 배열[]. ApiResponse data 배열은 현재 봉투 지시를 따르되 원문 최상위 배열 충돌 OQ-002 보존.'
    REQ-008: '서버 오류 — DB 읽기 실패 HTTP500. 정상200 빈 배열 대체 금지.'
    REQ-009: '응답 소비 UI — iconNm·scrnId 연결, 휴대폰 폭 pcOnlyYn=Y 숨김. LOCK_YN 필터·권한 사용 금지.'
    REQ-010: '응답 소비 UI — upperMenuId로 구성한 상위 그룹 두 번 클릭 시 자식 열림·닫힘. 서버 변경 없음.'
    REQ-011: '응답 소비 UI — 선택·새로고침·직접 주소에서 같은 본문·단일 틀 유지. /screens/{scrnId}는 설계 제안.'
    REQ-012: '응답 소비 UI — 실패 양쪽 오류·다시 시도·본문 숨김. 성공 재조회 뒤 원주소 재평가, 무주소 첫 화면. OQ-005 보존.'
    REQ-013: '응답 소비 UI — 정상200·data=[]이면 등록된 메뉴 없음. 실패 안내와 구분.'
    REQ-014: '접근 계약 — 인증 없이 localhost 조회 성공. 역할 검사·로그인401 추가 금지.'
    REQ-015: '응답 소비 UI — 숨김 후 SORT_ORD/MENU_ID 순 첫 가시 화면. 초기 UI-16, 가시 화면0개 빈 안내.'
    REQ-016: '응답 소비 UI — 미등록/중지·조상·계층 숨김/휴대폰 PC전용/미구현 순 첫 본문 안내만, Sidebar 유지. 판별 전달은 OQ-005이며 HTTP 보안 통제 아님.'
    REQ-017: '응답 소비 UI — UI-10 PC→휴대폰→PC에서 같은 주소의 준비 중→PC 전용 화면입니다→준비 중 복구 검수.'
    REQ-018: '응답 소비 UI — 없는 화면입니다·복귀 버튼 뒤 첫 가시 화면 이동 순차 검수. 가시 화면0개 빈 안내. 판별 전달 OQ-005.'
    REQ-019: '서버 무결성 — 빈 부모 정상 root 유지, 누락 부모·자기 참조·순환과 후손 제외 검수.'
    REQ-020: '서버 부수 효과 — 계층 오류별 경고 관찰. DB 보정·업무 감사 저장 금지, 로그 형식·보존 기간 미정.'
    REQ-021: '응답 소비 UI — 최종 가시 하위 화면 없는 그룹 제외. 휴대폰 G008 숨김·PC 복구 검수.'
    REQ-022: '응답 소비 UI — SCRN_ID·자식 혼합 행 클릭은 자기 화면 이동 없이 자식 토글. 직접 주소 취급 OQ-005.'
    REQ-023: '서버 부수 효과 — 혼합 메뉴 조회 뒤 경고 관찰. 추가 감사 저장 금지.'
    REQ-024: '서버 대표 결정 — 전체 후보 SORT_ORD/MENU_ID 순 첫 중복 행 조건 적용. 중지 첫 행 대신 뒤 행 승격 금지, 원본 보존. 직접 주소 전달 OQ-005.'
    REQ-025: '서버 부수 효과 — 중복 SCRN_ID 조회 뒤 경고 관찰. UNIQUE 추가·중복 삭제 대체 금지.'
    REQ-026: '응답 소비 UI — 즐겨찾기·최근 본 화면·화면 탭·상단 도구줄·단축키·알림 여섯 자리 준비 중·비활성 검수. 임시 데이터·작동 연출 금지.'
    REQ-027: '실행 제약 — Java21 LTS/Boot3.5.x/Gradle와 고정 Java17/Boot 및 BOM3.3.x 보존. React+TypeScript+Vite·PostgreSQL·Docker Compose 유지. OQ-001 해소 승인 없음.'
    REQ-028: '실행 경계 — localhost UI·API 성공과 내부망 타 기기 연결 불가 각각 검수. 휴대폰 검수는 개발 PC 개발자 도구.'
    REQ-029: '비영속 제약 — 조회·토글·이동 시 DB·브라우저 영속 저장소 상태 쓰기 금지. 메뉴 초기값만 별도 준비 예외.'
    REQ-030: '응답 소비 UI — cost 메뉴navi·화면틀 sidebar·header·spacing·color token·responsive behavior 적용 검수. 업무 카드 생성 금지, 세부 색·크기 원문 미제공.'
    REQ-031: '실행 전 준비 — TB_SY_USER_SCOPE·TB_SY_MENU·TB_SY_USER_PREF·TB_SY_NOTI·TB_BS_PART_STD·TB_PJ_PROJ·TB_BL_BILL·TB_BL_DUN_HIST·TB_CL_CLOSE 중 없는 표만 원문 DDL로 생성. GET에서 DDL 실행 금지.'
    REQ-032: '실행 전 준비 — SQ_TB_SY_NOTI START WITH 1 INCREMENT BY 1을 TB_SY_NOTI보다 먼저 준비하여 nextval 기본값 정의 검수. 기존 시퀀스 재설정 OQ-009.'
    REQ-033: '실행 전 준비 — -- FK: 주석은 관계 설명으로 보존하고 신규 물리 FK 비생성 검수. 기존 FK 제거 요구 아님.'
    REQ-034: '실행 전 준비 — 기존 구조 차이의 표·컬럼·형식 보고 후 확인 대기. 구조·행 보존, 삭제·재생성·자동 보정 금지. 보고 방식 OQ-010.'
    REQ-035: '실행 전 초기값 — 빈 TB_SY_MENU만 원문270-310행40개 단회 삽입 후 조회 검수. 기존 메뉴 무추가·무덮어쓰기. GET에서 seed 실행 금지.'
    REQ-036: '데이터 경계 — 다른8개 표 신규0행·기존 데이터 불변 검수. 구조 준비 외 업무 기능 없음.'
    REQ-037: '범위 경계 — 로그인·권한·역할 필터 없이 조회. UI-22·서버 접근 통제는 마지막 로그인 작업 범위. 신규 인증 API 금지.'
    REQ-038: '범위 경계 — 업무 화면·계산·업무 조회/저장/다운로드/업로드/편집0건. 메뉴 읽기·누락 구조·빈 메뉴 초기값은 제외의 예외.'
    REQ-039: '범위 경계 — 후속 도구 실제 동작 없음 검수. REQ-026 비활성 자리와 구분, 관련 저장·알림 API 추가 금지.'
    REQ-040: '범위 경계 — 메일·AI·외부 API·로그인 연동 및 준비 생성 금지. AI 메뉴는 준비 중 경로만 제공.'
    REQ-041: '실행 제약 — spring_boot3.3.x·node20.x·vite5.x·react18.x·postgres16.x 고정 BOM 보존. Boot3.5.x 충돌 OQ-001 미해결.'
    REQ-042: '산출물 제약 — backend·frontend·infra/docker-compose.yml 위치 검수. 이 명세로 구현 파일 생성·실행 완료를 주장하지 않음.'
    REQ-044: '실행 제약 — resolved·imperative·mybatis·blocking 유지, JPA/Spring JDBC/R2DBC 교체 금지. 정본은 plan.md exact marker JSON. spec.md의 selection_source=explicit과 원장 인용 policy-default 불일치 UP-001 보존. blocking_priority=[mybatis,jpa,spring-jdbc]·conflicts=[]는 버전 충돌 해소 아님.'
    REQ-045: '준비 기준 — 후속 schema/migration 기준으로 누락 생성·시퀀스 선행·기존 보존·차이 확인 검수. 도구·명령 OQ-008. HTTP 준비 endpoint 추가 금지.'
    REQ-046: '통합 검수 — 실제 backend 결과와 frontend Sidebar·경로를 같은 DB 조건으로 함께 확인. 제품 시험 not_run.'
    REQ-047: '실행 제약 — Compose 각 build context .dockerignore에서 node_modules·.git·dist·build·.next·coverage 제외 검수.'
    REQ-048: '구현 인수 — backend/ 실제 PostgreSQL 메뉴 조회 변경 필수. frontend 단독 mock으로 완료 금지.'
    REQ-049: '문서 책임 — spec.md 기술·범위, plan.md 구조·순서·실행 정본, tasks.md backend/frontend/infra 작업, ui-design.md 시각 계약 유지. 원장 이전 단계 설명은 현재 호출의 다른 파일 수정 허가가 아님.'
    REQ-050: '정책 유보 — 추가 성능·운영 보안·감사·백업·모니터링은 운영 배포 단계 결정. 미정을 없음·비활성으로 확정 금지. localhost 제한·메뉴 경고 유지.'
    REQ-051: '명명 제약 — AppLayout·Sidebar·Header·TB_SY_MENU·SCRN_ID·UI-16·/api/common/menus 보존. getCommonMenus·화면 route는 설계 제안이며 원문 확정 이름으로 가장하지 않음.'
  getHealth:
    REQ-043: '필수 경로 — /api/health 유지. GET·getHealth는 기존 설계 제안. 성공 값·DB 포함·오류·4xx 부재 근거 OQ-006. 제품 검증 화면 추가 금지.'

