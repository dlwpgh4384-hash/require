openapi: 3.0.3
info:
  title: 공통 메뉴 조회 HTTP 계약
  version: 0.1.0
  description: 설계 후보이며 구현 준비 완료가 아니다. 승인된 spec.md·plan.md·tasks.md와 원장 65개 항목을 보존한다. OQ-003·OQ-005·OQ-006·OQ-007 및 기술 충돌 승인
    전 최종 API 계약으로 채택하지 않는다.
x-contract-status: clarification_required
x-source-documents:
- SPEC-REQUEST.md:1-414
- spec.md
- plan.md
- tasks.md
- requirement-registry.json
x-open-questions:
- id: OQ-003
  canonical_ids:
  - REQ-008
  missing_fact: 원문 최상위 JSON 배열 및 []과 공통 ApiResponse 봉투의 충돌 해결 승인
  effect: 200의 allOf 봉투는 현 생성 지시를 표현한 미승인 후보이며 원문 배열 계약을 변경 승인한 것이 아니다. 서버·클라이언트 파서 구현 확정 차단.
- id: OQ-005
  canonical_ids:
  - REQ-026
  - REQ-028
  missing_fact: 조회에서 제외된 비활성 화면과 미등록 주소의 구별 데이터 전달 방식
  effect: USE_YN 공개나 신규 detail API를 추가하지 않는다. 주소 표시 판정 구현은 승인 대기.
- id: OQ-006
  canonical_ids:
  - REQ-006
  - REQ-008
  - REQ-018
  missing_fact: operationId·pagination/filtering·정정 가능한 입력 오류와 4xx의 원문 근거
  effect: 전체 계층을 임의 페이지로 자르지 않는다. 입력 파라미터·400·401·403 및 인프라 예외 사유를 발명하지 않는다. 계약 게이트 미충족으로 남긴다.
- id: OQ-007
  canonical_ids:
  - REQ-037
  missing_fact: /api/health의 HTTP method·성공 결과·인증·DB 점검·오류
  effect: Path Item으로 경로만 보존한다. 임의 GET/200이나 빈 응답 데이터 객체를 승인 계약으로 작성하지 않는다.
paths:
  /api/common/menus:
    get:
      operationId: listCommonMenus
      summary: 공통 메뉴 목록 조회
      description: SPEC-REQUEST.md:39-45,403의 단일 업무 조회다. 내구 실행 계약의 operationId는 listCommonMenus다. requestBody는
        없다. 서버는 PC_ONLY_YN 값을 제공하고 브라우저가 폭별 화면 메뉴를 숨긴다. 메뉴 요청은 seed 실행 진입점이 아니다.
      x-related-requirements:
      - REQ-005
      - REQ-006
      - REQ-007
      - REQ-008
      - REQ-009
      - REQ-016
      - REQ-018
      - REQ-021
      - REQ-022
      - REQ-025
      x-business-rules:
      - 'REQ-005: 로컬 PostgreSQL TB_SY_MENU만 메뉴 원천으로 사용하며 예시 목록으로 대체하지 않는다.'
      - 'REQ-006: USE_YN=''Y''이며 유효한 조상 분기만 반환하고 UPPER_MENU_ID 계층, SORT_ORD 및 동률 MENU_ID 순서를 보존한다.'
      - 'REQ-007: USE_YN=''N'' 메뉴뿐 아니라 그 자손도 제외한다. 활성 자식만 선행 조회하여 비활성 조상 정보를 잃지 않는다.'
      - 'REQ-021: 빈 UPPER_MENU_ID는 정상 루트다. 부모 부재·자기 참조·다중 순환 노드와 그 자손은 제외하되 정상 분기는 유지한다.'
      - 'REQ-008: 공개 필드는 menuId, upperMenuId, menuNm, scrnId, menuLvl, sortOrd, pcOnlyYn, iconNm이며 정상 0건도 200이다. 최상위 응답 모양은
        OQ-003 승인 대기다.'
      - 'REQ-009: DB 조회 오류는 500으로 반환하며 정상 빈 목록으로 위장하지 않는다.'
      - 'REQ-018: 로그인 정보 없이 호출한다. REQ-033의 localhost 경계는 네트워크 바인딩이며 HTTP 역할 인가가 아니다.'
      - 'REQ-012: LOCK_YN을 필터·인가에 사용하지 않는다. REQ-011의 휴대폰 폭 필터는 브라우저 표시 책임이다.'
      x-side-effects:
      - 'REQ-022: 고아·자기 참조·다중 순환 메뉴를 발견하면 서버 경고를 남긴다. 형식·빈도·보관은 OQ-011이다.'
      - 'REQ-025: SCRN_ID와 자식이 함께 있는 혼합 노드를 발견하면 서버 경고를 남긴다.'
      - 'REQ-032: 조회는 업무 행·메뉴 상태를 저장하지 않고 초기값을 삽입하지 않는다.'
      x-required-tests:
      - 'happy: 원문 초기값과 정상 DB에서 GET /api/common/menus 호출 -> 200이며 공개 목록에서 G001과 M001의 부모 관계 및 SORT_ORD 동률 MENU_ID 순서가 DB와
        일치한다.'
      - 'auth: 로그인 정보 없는 localhost 요청과 정상 DB -> 200이며 로그인 리다이렉트·401·403을 요구하지 않는다(REQ-018).'
      - 'validation: 고아·자기 참조·다중 순환 노드 및 각 자손이 있는 격리 DB에서 조회 -> 해당 menuId는 결과에 없고 정상 루트는 남으며 서버 경고를 읽을 수 있다(REQ-021, REQ-022).'
      - 'business: USE_YN=''N'' 조상과 USE_YN=''Y'' 자손이 있는 DB에서 조회 -> 두 노드 모두 반환 목록에서 제외되고 TB_SY_MENU 행은 전후 동일하다(REQ-007).'
      - 'side-effect: SCRN_ID와 자식을 함께 가진 노드를 조회 -> 혼합 노드 서버 경고가 존재하고 감사·알림 행 및 메뉴 데이터 쓰기는 발생하지 않는다(REQ-025, REQ-032).'
      - 'empty: 초기화가 끝난 실행 중 정상 조회 결과가 0건 -> 200과 빈 메뉴 결과이며 초기값이 재삽입되지 않는다; 최상위 []/data 배열 판정은 OQ-003 확정 후 검사한다.'
      - 'error: 메뉴 DB 연결 실패 상태에서 조회 -> 500이며 성공 빈 결과가 아니고, 복구 후 다시 조회하면 실제 목록을 반환한다(REQ-009, REQ-016).'
      x-source-response:
        source: SPEC-REQUEST.md:41
        success_status: 200
        shape: 최상위 JSON 배열; 빈 경우 []
        item_schema: '#/components/schemas/MenuItem'
        approval: 원문 계약 보존; 공통 봉투와의 조정 미승인(OQ-003)
      x-contract-blockers:
      - 'OQ-003: 봉투 성공 응답과 최상위 배열 원문 간 충돌'
      - 'OQ-006: pagination/filtering과 정정 가능한 4xx 미정; 업무 GET이므로 인프라 예외로 면제하지 않음'
      responses:
        '200':
          description: 메뉴 조회 성공. 0건도 200이다. 아래 봉투는 공통 생성 지시를 따른 후보이며 최상위 배열 약속과의 충돌 OQ-003 승인 전 배포 계약이 아니다.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MenuListResponse'
        '500':
          description: 메뉴 조회 중 DB 오류. 성공 빈 목록이 아니다. 오류 코드·상세 메시지 정책은 미정이며 DB 접속정보를 공개하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      operationId: health
      summary: 프로세스 생존 확인
      description: 인증 없이 프로세스 생존 여부를 확인한다. DB 연결 상태는 검사하지 않는다.
      x-related-requirements:
      - REQ-037
      responses:
        '200':
          description: 프로세스가 요청을 처리할 수 있다.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - UP
components:
  schemas:
    YesNo:
      type: string
      enum:
      - Y
      - N
      description: 원문 CHECK의 공통 Y/N 값. USE_YN·PC_ONLY_YN·LOCK_YN·READ_YN·BDGT_MANUAL_YN·CNCL_YN·RESEND_YN의 값 집합이 동일하다. 업무
        상태나 역할 enum이 아니다.
    ApiResponse:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        meta:
          type: object
          description: 공통 응답 메타데이터. 키·추적값·페이지 필드는 원문 미정이므로 확정하지 않는다.
          additionalProperties: true
      description: 공통 성공 봉투. data는 연산별 allOf 분기에서 요구한다. 봉투 채택은 OQ-003 승인 대기.
    ApiError:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        meta:
          type: object
          description: 실패 메타데이터. 상세 오류 필드·코드는 미정이며 저장 컬럼을 복사하지 않는다.
          additionalProperties: true
      description: 공통 실패 봉투. 전체 ApiError를 ApiResponse 내부에 중첩하지 않는다. 별도 오류 항목 명명·형식은 확인 필요.
    MenuItem:
      type: object
      required:
      - menuId
      - upperMenuId
      - menuNm
      - scrnId
      - menuLvl
      - sortOrd
      - pcOnlyYn
      - iconNm
      additionalProperties: false
      properties:
        menuId:
          type: string
          maxLength: 20
          description: TB_SY_MENU.MENU_ID 공개 값
        upperMenuId:
          type: string
          maxLength: 20
          description: TB_SY_MENU.UPPER_MENU_ID 공개 값
          nullable: true
        menuNm:
          type: string
          maxLength: 50
          description: TB_SY_MENU.MENU_NM 공개 값
        scrnId:
          type: string
          maxLength: 10
          description: TB_SY_MENU.SCRN_ID 공개 값
          nullable: true
        menuLvl:
          type: integer
          description: TB_SY_MENU.MENU_LVL의 원문 NUMERIC 정수 값
        sortOrd:
          type: integer
          description: TB_SY_MENU.SORT_ORD의 원문 NUMERIC 정수 값
        pcOnlyYn:
          $ref: '#/components/schemas/YesNo'
        iconNm:
          type: string
          maxLength: 30
          description: TB_SY_MENU.ICON_NM 공개 값
          nullable: true
      description: REQ-008의 여덟 공개 필드만 허용한다. nullable인 저장 컬럼은 null 가능하다. 감사 컬럼·USE_YN·LOCK_YN은 공개하지 않는다.
    MenuListResponse:
      description: 공통 생성 계약의 봉투 후보. REQ-008 원문의 최상위 배열을 대체하려면 OQ-003 승인이 필요하다. data=[]가 원문 []과 동일한 wire shape이라고 주장하지 않는다.
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/MenuItem'
            description: 계층·활성 제외 및 정렬이 반영된 공개 메뉴 항목. 0건은 빈 배열이다.
