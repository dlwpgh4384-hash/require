        in: query
        required: true
        description: 선택 연도·공통 기간 선택(연도+월) 범위
        schema:
          type: integer
      - name: baseMonth
        in: query
        required: true
        description: 기준월·처음은 가장 최근 달(마지막 마감 달 + 1)·CASH_BASE_YM의 달부터 가장 최근 달까지만
        schema:
          type: integer
          minimum: 1
          maximum: 12
      - name: projectId
        in: query
        required: false
        description: 선택월 프로젝트 선택상자·미지정은 전체·그 달 대상이 아니면 400(projectId)
        schema:
          type: string
      - name: contractTypeCode
        in: query
        required: false
        description: 기존 CTRT_TYPE 코드
        schema:
          type: string
      - name: projectStatus
        in: query
        required: false
        description: 기준월 당시 진행 또는 종료
        schema:
          type: string
          enum:
          - 진행
          - 종료
      - name: alertOnly
        in: query
        required: false
        description: 경보 있는 것만
        schema:
          type: boolean
      x-business-rules:
      - 열거된 CALC_ID와 식-00의 DB 정의를 읽어 계산하며 수식을 코드 상수로 복제하지 않는다.
      - 처음은 가장 최근 달(마지막 마감 달 + 1)의 년·월을 보여 주고 해당 달 말까지 누적으로 읽는다. 기준월 이후 시작 프로젝트는 제외하고 월간 마진율은 선택 한 달이다. 마감월은 고정값, 미마감월은 현재자료와 그 달에 유효한
        계약·투입 이력으로 계산한다.
      - 누적 매출·누적 이익(내부 제외)·저마진 경보 건수·예산 초과 건수·연구개발비 누계(내부)를 기준월 전체 대상 프로젝트로 집계한다. 목록 필터는 요약에 적용하지 않는다.
      - 턴키 누적 매출은 계약금액×진행률인 식-18, 월단위·파견은 월 매출 누계로 읽고 TB_BL_BILL 청구를 매출에 쓰지 않는다.
      - 선택월 프로젝트 선택상자(기본 전체)·계약유형·기준월 상태·경보 조건으로 연도 겹침 대상만 조회하고 수주예정·실주는 제외한다. 요청55행 모든 열을 경보 많은 순으로 표시한다.
      - 누적 원가에 배분 원가와 팀비·프로젝트경비·추가 직접 경비를 포함하고 열 옆 ⓘ에 근거를 표시한다. 무상지원 원가는 해당 프로젝트 원가를 쓴다.
      - 턴키 예상 최종 마진율의 남은 예상 원가는 남은 달 투입 배정 MM×그 사람 월 인건비이며 배분표 유무와 관계없이 같은 원천을 쓴다.
      - 월 인건비는 최근 월 인건비 → 개발자 풀 월 급여 → 배분표 남은 달 금액÷MM×예산÷계약금액 순서로 찾고 다 없으면 0으로 세며, 예상값 옆에 단가 없음과 hover 근거를 표시한다(식-20, 사람별 원 단위 버림).
      - 계획 MM은 TB_PJ_MNPW_PLAN.PLAN_MM 직무별 합계를 그대로 읽는다. 계획이 없으면 계획 없음으로 표시하고 투입 초과 원인을 계산하지 않는다.
      - 목표 기본20%보다 5%p 넘게 낮을 때만 저마진 경보로 판정한다. 정확히 5.0%p 낮음은 경보가 아니다.
      - 예산 소진율100% 이상은 빨강·80% 이상은 주황으로 표시한다.
      - 내부 프로젝트는 실제 MM·연구개발비 누계만 표시하며 계약금액·마진 칸은 비운다.
      - PM에게 원가·이익 금액을 노출하지 않는다. PM은 기존 UI-31 진척률·원가 사용률을 이용한다.
