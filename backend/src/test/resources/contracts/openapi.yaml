              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: putCommonUserPreference
      summary: 사용자 공통 설정 저장
      security: []
      x-related-requirements:
      - REQ-054
      - REQ-055
      - REQ-074
      - REQ-075
      - REQ-076
      - REQ-078
      - REQ-087
      - REQ-097
      - REQ-109
      parameters: *id001
      description: 서버 고정 admin의 설정 단건을 저장한다. 사용자 ID·역할을 받거나 로그인 검사를 추가하지 않는다.
