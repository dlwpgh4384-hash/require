openapi: 3.0.3
info:
  title: 공통 화면 틀 메뉴 계약
  version: 0.1.0
  description: >-
    spec.md와 requirement-registry.json을 기준으로 원문 식별자와 요구 의미를 보존한다.
    getCommonMenus·getHealth 및 GET /api/health는 기존 설계 제안이다.
    아래 메뉴 성공 봉투는 현재 생성 지시를 따르지만 원문 최상위 배열과의 충돌 OQ-002를
    해결한 사용자 승인으로 취급하지 않는다. 직접 진입 정보 전달 OQ-005,
    health 결과·오류 OQ-006, 페이지·검색 입력과 호출자 오류 OQ-007은 확인 필요다.
    원장 REQ-044의 출처 불일치 UP-001도 보존한다. 완성된 실행 계약이나 구현 성공을 주장하지 않는다.
paths:
  /api/common/menus:
    get:
      operationId: getCommonMenus
      summary: 사용 메뉴 계층 조회
      description: >-
        실제 PostgreSQL TB_SY_MENU만 읽는다. 전체 관계에서 중복 대표와 계층을 판정한 뒤
        사용 메뉴를 반환한다. PC_ONLY_YN의 폭 필터와 최종 빈 그룹 숨김은 브라우저 책임이다.
        개발 PC에서 인증 없이 호출하며 localhost 제한은 배포 연결 경계다.
        요청 검색·페이지 입력과 호출자 정정 가능한 오류는 원문에 정의되지 않았다.
        4xx를 발명하거나 업무 읽기를 인프라 예외로 위장하지 않는다(OQ-007).
        GET은 DDL·seed·화면 상태 저장을 실행하지 않는다.
      security: []
      x-related-requirements:
        - REQ-001
        - REQ-002
        - REQ-003
        - REQ-004
        - REQ-005
        - REQ-006
        - REQ-007
        - REQ-008
        - REQ-009
        - REQ-010
        - REQ-011
        - REQ-012
        - REQ-013
        - REQ-014
        - REQ-015
        - REQ-016
        - REQ-017
        - REQ-018
        - REQ-019
        - REQ-020
        - REQ-021
        - REQ-022
        - REQ-023
        - REQ-024
        - REQ-025
        - REQ-026
        - REQ-027
        - REQ-028
        - REQ-029
        - REQ-030
        - REQ-031
        - REQ-032
        - REQ-033
        - REQ-034
        - REQ-035
        - REQ-036
        - REQ-037
        - REQ-038
        - REQ-039
        - REQ-040
        - REQ-041
        - REQ-042
        - REQ-044
        - REQ-045
        - REQ-046
        - REQ-047
        - REQ-048
        - REQ-049
        - REQ-050
        - REQ-051
      x-requirement-link-semantics: >-
        서버 조회뿐 아니라 이 결과를 소비하는 공통 UI, 실행 전 DB 준비, 실행·검수 제약과
        범위 경계를 연결한다. 요구 면제 또는 구현 완료 선언이 아니다. UI 조작은 로컬 동작이며
        GET이 상태를 저장하거나 구조·초기값을 준비한다는 뜻이 아니다.
        번호별 역할·검수 근거는 x-requirement-context에서 구분한다.
        REQ-016 판별은 이 목록만으로 완성되지 않으므로 OQ-005로 남긴다.
      x-pagination-contract-status: >-
        OQ-007 확인 필요. REQ-006의 입력 항목은 전체 계층 조회이며 검색·페이지 요청은 없다.
        USE_YN과 계층 제외는 고정 서버 규칙, PC_ONLY_YN의 폭 제외는 브라우저 규칙이다.
        이를 임의 query parameter로 바꾸거나 페이지 크기·기본값·검색어·400 정책을 발명하지 않는다.
        pagination/filtering 입력 계약은 미완성이며 지원 완료나 검사 면제를 주장하지 않는다.
      x-client-error-contract-status: >-
        OQ-007 확인 필요. 호출자 정정 가능한 입력·인증·업무 오류의 근거가 없으며
        4xx 완비를 주장하지 않는다. 업무 메뉴 조회이므로 인프라 읽기 전용 예외를 선언하지 않는다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuItem'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: postCommonMenu
      summary: 대메뉴·서브메뉴 등록
      security: []
      x-related-requirements:
      - REQ-221
      - REQ-229
      - REQ-230
      - REQ-231
      - REQ-233
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonMenuCreateInput'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CommonMenuSettingItem'
        '400':
          description: 입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/common/user-preferences/{prefTypeCd}/{prefKey}:
    get:
      operationId: getCommonUserPreference
      summary: 사용자 공통 설정 조회
      security: []
      x-related-requirements:
      - REQ-054
      - REQ-055
      - REQ-074
      - REQ-075
      - REQ-078
      - REQ-087
      - REQ-097
      parameters: &id001
      - name: prefTypeCd
        in: path
        required: true
        schema:
          type: string
          enum:
          - FAV
          - RECENT
          - MENU_FOLD
          - PAGE_SIZE
          - DENSE
          - PERIOD
          - AMT_UNIT
      - name: prefKey
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 30
        description: PERIOD는 대상 SCRN_ID, 나머지는 GLOBAL. 기존 DML 충돌 여부는 확인한다.
      x-aiops-query-role:
        entity: TB_SY_USER_PREF
        result_path:
        - data
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferenceResponse'
        '400':
          description: 입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: putCommonUserPreference
      summary: 사용자 공통 설정 저장
      security: []
      x-related-requirements:
      - REQ-054
      - REQ-055
      - REQ-074
      - REQ-075
      - REQ-076
      - REQ-078
      - REQ-087
      - REQ-097
      - REQ-109
      parameters: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceInput'
      x-business-rules:
      - FAV JSON 배열은 최대 10개, RECENT는 최대 5개다. 한도를 넘긴 요청을 저장하지 않는다.
      - PAGE_SIZE는 20/50/100, DENSE는 넓게/좁게, MENU_FOLD는 true/false, AMT_UNIT은 원/천 원/백만 원 문자열이다. PERIOD는 year 및 월형의 month를 직렬화한다.
      - PERIOD의 허용 연도·최신 월 판정은 부품 입력과 최신 월 원천을 따르며 이 API가 업무 자료 연도를 조회하지 않는다.
      - 기존 행은 읽은 MOD_DTTM과 DB 시각이 같은 경우에만 갱신한다. 다른 시각은 덮어쓰지 않는다.
      x-side-effects:
      - TB_SY_USER_PREF 신규 행은 REG_USER_ID=admin·REG_DTTM, 갱신은 MOD_USER_ID=admin·MOD_DTTM을 기록하고 다음 GET으로 읽힌다.
      - 업무 감사·알림 행은 생성하지 않는다. 화면 설정 반영·3초 완료 알림은 성공을 소비한 UI의 책임이다.
      x-state-transitions:
      - from: 행 없음
        to: 저장 행
        condition: 유효한 설정 최초 저장
      - from: 기존 PREF_VAL
        to: 새 PREF_VAL
        condition: 유효 입력·MOD_DTTM 일치
      - from: 기존 PREF_VAL
        to: 기존 PREF_VAL
        condition: 입력 오류·한도 초과·MOD_DTTM 불일치
      x-required-tests:
      - 'happy: 기존 admin/PAGE_SIZE/GLOBAL과 읽은 modDttm으로 prefVal=50 저장 -> 200이며 후속 GET과 TB_SY_USER_PREF.PREF_VAL이 문자열
        50이다.'
      - 'auth: 인증 헤더 없이 admin/MENU_FOLD/GLOBAL 유효 설정 저장 -> 로그인·역할 검사 없이 200이며 GET에서 변경값이 읽힌다. 이번 요청은 로그인·권한을 제외하므로
        근거 없는 401·403 거부 시험을 만들지 않는다.'
      - 'validation: PAGE_SIZE/GLOBAL에 prefVal=30 저장 -> 400 ApiError.errors의 prefVal 필드 오류이며 기존 PAGE_SIZE 값은 그대로다.'
      - 'business: 기존 행의 읽은 modDttm과 DB MOD_DTTM이 다른 채 저장 -> 409와 다른 사람이 먼저 바꿨습니다. 다시 불러와 주세요.이며 PREF_VAL은 DB 최신값
        그대로다.'
      - 'side-effect: 기존 MENU_FOLD 행을 읽은 modDttm으로 변경 저장 -> TB_SY_USER_PREF.MOD_USER_ID=admin·MOD_DTTM 갱신이 DB에 있고
        다음 GET.modDttm과 같다.'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferenceResponse'
        '400':
          description: 입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/common/users:
    get:
      operationId: getCommonUsers
      summary: 사용자 목록 조회
      security: []
      x-related-requirements:
      - REQ-130
      - REQ-121
      description: UI-23 사용자 업무. 서버 실행자는 admin으로 고정한다. 물리 필드·코드 매핑은 OQ-DATA-023의 SQL 대조 후 확정하며 DTO는 비밀번호·해시를 공개하지
        않는다.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 20
          - 50
          - 100
          default: 20
        description: 화면은 공통 목록 설정을 전달한다. default는 HTTP 요청 생략 시 설계값이며 제품 seed가 아니다.
      - name: roleCd
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          description: DML 원천 코드. 미제공 코드를 하드코딩하지 않는다.
      - name: userStatCd
        in: query
        required: false
        schema:
          type: string
          enum:
          - USE
          - LOCK
          - STOP
      - name: keyword
        in: query
        required: false
        schema:
          type: string
        description: 이름 또는 아이디 검색
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CommonUserListResult'
        '400':
          description: 입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
