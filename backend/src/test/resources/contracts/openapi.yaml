      x-requirement-link-semantics: >-
        서버 조회뿐 아니라 이 결과를 소비하는 공통 UI, 실행 전 DB 준비, 실행·검수 제약과
        범위 경계를 연결한다. 요구 면제 또는 구현 완료 선언이 아니다. UI 조작은 로컬 동작이며
        GET이 상태를 저장하거나 구조·초기값을 준비한다는 뜻이 아니다.
        번호별 역할·검수 근거는 x-requirement-context에서 구분한다.
        REQ-016 판별은 이 목록만으로 완성되지 않으므로 OQ-005로 남긴다.
      x-pagination-contract-status: >-
        OQ-007 확인 필요. REQ-006의 입력 항목은 전체 계층 조회이며 검색·페이지 요청은 없다.
        USE_YN과 계층 제외는 고정 서버 규칙, PC_ONLY_YN의 폭 제외는 브라우저 규칙이다.
        이를 임의 query parameter로 바꾸거나 페이지 크기·기본값·검색어·400 정책을 발명하지 않는다.
        pagination/filtering 입력 계약은 미완성이며 지원 완료나 검사 면제를 주장하지 않는다.
      x-client-error-contract-status: >-
        OQ-007 확인 필요. 호출자 정정 가능한 입력·인증·업무 오류의 근거가 없으며
        4xx 완비를 주장하지 않는다. 업무 메뉴 조회이므로 인프라 읽기 전용 예외를 선언하지 않는다.
      x-aiops-query-role:
        entity: TB_SY_MENU
        result_path: [data]
      x-business-rules:
        - 'REQ-005: 이름·순서의 유일 원천은 실제 TB_SY_MENU다. 고정 예시 배열로 대체하지 않는다.'
        - 'REQ-006: USE_YN=Y인 메뉴를 반환하되 중지 조상의 후손도 숨기며 형제는 SORT_ORD·MENU_ID 순이다.'
        - 'REQ-007: 공개 필드는 menuId·upperMenuId·menuNm·scrnId·menuLvl·sortOrd·pcOnlyYn·iconNm뿐이다. 등록·수정·LOCK_YN 컬럼을 공개하지 않는다.'
        - 'REQ-019: 빈 UPPER_MENU_ID는 정상 root다. 누락 부모·자기 참조·다중 순환 메뉴와 후손은 숨긴다.'
        - 'REQ-024: 전체 후보에서 SORT_ORD·MENU_ID 순 첫 중복 SCRN_ID 행의 사용·PC 전용 조건을 따른다. 뒤의 사용 가능 행을 대표로 승격하지 않는다.'
      x-side-effects:
        - 'REQ-020: 계층 오류를 읽으면 서버 경고를 남기되 DB 행을 보정하거나 업무 감사 이력을 저장하지 않는다. 로그 형식·보존 기간은 미정이다.'
        - 'REQ-023: SCRN_ID와 자식을 함께 가진 혼합 메뉴를 읽으면 서버 경고를 남긴다.'
        - 'REQ-025: 중복 SCRN_ID를 발견하면 서버 경고를 남긴다. 중복 삭제·UNIQUE 추가로 대체하지 않는다.'
      x-required-tests:
        - 'happy: 독립 검수 DB의 메뉴명·SORT_ORD 변경 후 GET 호출 -> 200 data에 변경된 menuNm과 SORT_ORD·MENU_ID 순 메뉴가 반환된다. 봉투와 원문 배열의 충돌은 OQ-002다(REQ-005, REQ-006).'
        - 'empty: 정상 메뉴 조회0건에서 GET 호출 -> 200 data=[]이며500으로 바뀌지 않는다(REQ-007).'
        - 'auth: 인증 헤더 없이 localhost에서 GET 호출 -> 로그인 요구 없이200 메뉴 결과를 반환한다(REQ-014).'
        - 'business: 중지 부모와 사용 중 자식이 있는 DB에서 GET 호출 -> 부모·자식 모두 data에 없고 원본 행은 보존된다(REQ-006).'
        - 'integrity: 누락 부모·자기 참조·상호 순환 및 각각의 후손과 정상 빈 부모를 둔 DB에서 GET 호출 -> 오류 후손은 없고 정상 root는 남는다(REQ-019).'
        - 'duplicate-disabled: 같은 SCRN_ID 첫 정렬 행이 중지이고 뒤 행은 사용인 DB에서 GET 호출 -> 뒤 행은 반환되지 않고 원본 중복 행 수는 유지된다(REQ-024).'
        - 'duplicate-pc-only: 같은 SCRN_ID 첫 행이 PC 전용이고 뒤 행은 비전용인 DB에서 GET하고 휴대폰 폭으로 표시 -> 뒤 행이 승격되지 않고 해당 화면 메뉴는 숨겨진다. 직접 주소에서는 PC 전용 안내가 필요하며 전달 방식은 OQ-005다(REQ-024).'
        - 'hierarchy-warning: 누락 부모·자기 참조·다중 순환을 각각 둔 검수 DB에서 GET 호출 -> 각각의 서버 경고가 관찰되고 원본 DB는 불변이다(REQ-020).'
        - 'mixed-warning: SCRN_ID와 자식을 함께 가진 메뉴를 둔 DB에서 GET 호출 -> 혼합 사유 서버 경고가 관찰된다. 정상 그룹만 둔 별도 조건에서는 혼합 사유 경고가 없다(REQ-023).'
        - 'duplicate-warning: 동일 SCRN_ID 복수 행 DB에서 GET 호출 -> 중복 사유 서버 경고가 관찰되고 원본 행은 보존된다. SCRN_ID가 유일한 별도 조건에서는 중복 사유 경고가 없다(REQ-025).'
        - 'failure: DB 읽기를 실패시킨 뒤 GET 호출 -> HTTP500이며 정상200 빈 메뉴나 임시 메뉴로 대체되지 않는다(REQ-008).'
        - 'ui-layout: 정상 메뉴를 읽어 UI-16 선택 후 새로고침·직접 재진입 -> AppLayout·Sidebar·Header·본문 자리는 각각 하나이며 선택 본문은 준비 중이다(REQ-001, REQ-002, REQ-011).'
        - 'ui-placeholders-all-screens: 제공 초기 메뉴에서 각 가시 화면을 차례로 선택 -> 초기30개 SCRN_ID 본문 모두 준비 중이며 업무 입력·계산·업무 명령은 없다(REQ-002, REQ-038).'
        - 'ui-header: 정상 메뉴로 앱 진입 -> Header는 후속 제목·버튼 자리만 제공하고 가짜 사용자 이름·알림 건수·현재 업무 버튼 동작은 없다(REQ-003).'
        - 'ui-width: PC 폭 앱에서 개발자 도구로 휴대폰 폭 전환 후 메뉴 펼침·접기 -> PC 기본 펼침 및 휴대폰 펼침·접힘 전환, PC_ONLY_YN=Y인 여섯 화면 메뉴 숨김이 관찰된다. 수치는 OQ-003이다(REQ-004, REQ-009).'
        - 'ui-mapping: 메뉴의 아이콘·화면 연결 확인 후 PC 폭에서 LOCK_YN=Y인 시스템 그룹 열기 -> ICON_NM은 아이콘, SCRN_ID는 해당 화면에 연결되고 LOCK_YN만으로 메뉴가 숨겨지지 않는다(REQ-009).'
        - 'ui-group: 정상 응답으로 구성된 닫힌 상위 그룹을 두 번 클릭 -> 하위 메뉴가 열렸다 닫히며 영속 저장은 발생하지 않는다(REQ-010, REQ-029).'
        - 'ui-failure: 직접 주소 진입 중 메뉴 GET이500 반환 -> Sidebar와 본문 양쪽에 메뉴를 불러오지 못했습니다 및 다시 시도 버튼이 표시되고 화면 내용은 감춰진다(REQ-012).'
        - 'ui-retry: 앞의 실패 후 DB 복구하고 다시 시도 -> 같은 GET 성공 뒤 원주소를 재평가하여 해당 본문 또는 제한 안내를 표시한다. 무주소 접속이었다면 첫 가시 화면을 연다. 숨김/미등록 판별 전달은 OQ-005다(REQ-012, REQ-015, REQ-016).'
        - 'ui-empty: 정상 메뉴 GET이200·data=[] 반환 -> 등록된 메뉴 없음이 표시되고 오류 재시도 안내로 바뀌지 않는다(REQ-013).'
        - 'ui-first-seed: 제공 초기 메뉴 DB로 화면 주소 없이 최초 접속 -> 숨김 적용 후 SORT_ORD·MENU_ID 순 첫 가시 화면 UI-16 준비 중이 열린다(REQ-015).'
        - 'ui-first-hidden: 첫 화면이 숨겨진 DB로 무주소 접속 -> 다음 가시 화면이 열리며 UI-16으로 고정되지 않는다. 가시 화면0개인 별도 조건에서는 등록된 메뉴 없음이다(REQ-015).'
        - 'ui-direct-priority: 사용 중지이면서 PC 전용인 미구현 화면에 휴대폰 폭 직접 진입 -> Sidebar를 유지하고 본문에 사용할 수 없는 화면입니다만 표시한다. 판별 정보 전달은 OQ-005다(REQ-016).'
        - 'ui-direct-states: 미등록, 중지·조상·계층 숨김, 사용 가능한 PC 전용의 휴대폰 폭, 사용 가능한 비전용 미구현 주소를 각각 열기 -> 순서대로 없는 화면입니다, 사용할 수 없는 화면입니다, PC 전용 화면입니다, 준비 중을 표시한다. 먼저 걸리는 하나만 표시하며 HTTP 권한 거부로 바꾸지 않는다. OQ-005 확인 필요다(REQ-016).'
        - 'ui-pc-only: UI-10 PC 폭 준비 중에서 휴대폰 폭 축소 후 다시 PC 폭 확대 -> 같은 주소에서 PC 전용 화면입니다로 전환한 뒤 UI-10 준비 중으로 복구된다(REQ-017).'
        - 'ui-unknown-return: 초기 DB에서 미등록 화면 주소 열기 -> 없는 화면입니다와 첫 화면으로 가는 버튼이 보인다. 이어 버튼 클릭 -> 첫 가시 화면 UI-16 준비 중으로 이동한다. 가시 화면0개 조건에서는 등록된 메뉴 없음이다. 판별 전달은 OQ-005다(REQ-018, REQ-015).'
        - 'ui-empty-group: 초기 메뉴를 읽은 뒤 휴대폰 폭으로 줄였다가 PC 폭 확대 -> UI-14만 가진 G008은 휴대폰 폭에서 숨겨지고 PC 폭에서 다시 표시된다(REQ-021).'
        - 'ui-mixed: SCRN_ID와 자식을 함께 가진 행을 조회한 뒤 클릭·재클릭 -> 자식 목록이 열렸다 닫히고 현재 주소가 그 행의 SCRN_ID로 바뀌지 않는다. 해당 SCRN_ID 직접 진입 취급은 OQ-005다(REQ-022).'
        - 'ui-tools: 메뉴를 읽고 여섯 후속 도구 자리를 확인·조작 -> 즐겨찾기·최근 본 화면·화면 탭·상단 도구줄·단축키·알림 모두 준비 중 비활성이며 임시 데이터나 실제 동작이 생기지 않는다(REQ-026, REQ-039).'
        - 'read-only: 메뉴 GET 후 그룹 토글·화면 이동 -> TB_SY_USER_PREF 포함 DB와 브라우저 영속 저장소에 화면 상태 쓰기가 없고 나머지8개 표 데이터도 바뀌지 않는다(REQ-029, REQ-036).'
        - 'schema-before-query: 독립 빈 DB에서 후속 schema 준비 절차 후 GET -> 누락된9개 표만 원문 구조로 준비되고 SQ_TB_SY_NOTI가 TB_SY_NOTI보다 먼저 준비되며 새 물리 FK는 없다. GET 자체가 구조를 생성하지 않는다(REQ-031, REQ-032, REQ-033, REQ-045).'
        - 'schema-mismatch: 원문과 형식이 다른 기존 컬럼을 둔 DB에서 준비 절차 실행 -> 표·컬럼·형식 차이를 보고하고 확인을 기다리며 기존 구조·행을 변경·삭제·재생성하지 않는다. 보고 방식은 OQ-010이다(REQ-034).'
        - 'seed-before-query: 빈 TB_SY_MENU에만 초기값 준비 후 GET하고 준비 절차 재실행 -> 초기40행 유지. 기존 메뉴가 있는 별도 DB에서는 추가·덮어쓰기 없고 다른8개 표도 불변이다. GET이 seed를 실행하지 않는다(REQ-035, REQ-036).'
        - 'integration: 실제 backend PostgreSQL 메뉴 GET과 같은 DB의 frontend를 함께 검수 -> API 공개 필드·정렬·숨김과 Sidebar·경로 표시가 대응하며 frontend 단독 모의 메뉴로 대체되지 않는다(REQ-046, REQ-048).'
      responses:
        '200':
          description: 사용 메뉴 목록 또는 빈 목록. data 봉투는 OQ-002 충돌을 보존한 설계다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data, meta]
                    properties:
                      meta:
                        type: object
                        description: D3 implementation contract; staged specification remains unchanged.
                        required: [screenAccess]
                        properties:
                          screenAccess:
                            type: array
                            description: One entry per distinct nonempty database SCRN_ID, using its first SORT_ORD/MENU_ID candidate, including unavailable screens.
                            items:
                              $ref: '#/components/schemas/ScreenAccess'
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuItem'
        '500':
          description: 메뉴 DB 읽기 실패. 상세 오류 필드는 원문 미제공이며 공통 실패 봉투만 제안한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      operationId: getHealth
      summary: 실행 상태 확인
      description: >-
        REQ-043의 필수 경로를 보존한다. GET과 operationId는 기존 구현 명칭 제안이다.
        성공 값·본문·DB 검사 여부는 OQ-006이므로 빈 객체를 완성된 결과로 제시하지 않는다.
        아래200은 결과 정의 대기 표지이며 bodyless 확정이 아니다.
        호출자 오류 및 그 부재 근거도 미제공이므로 인프라 예외 요건을 충족했다고 주장하지 않는다.
        health라는 경로 이름만으로 4xx를 면제하지 않는다. 구현 확정 전 확인 필요하다.
      security: []
      x-related-requirements: [REQ-043]
      x-contract-incomplete-reason: >-
        OQ-006 확인 필요. 관찰 가능한 성공 값·본문·실패 조건과 HTTP 결과가 정의되지 않았다.
        ApiResponse 참조는 공통 봉투만 나타내며 연산별 결과 완성을 뜻하지 않는다.
      x-required-tests:
        - 'route: 로컬 backend 기동 뒤 GET /api/health 호출 -> 필수 경로를 처리하며 미등록 경로404로 반환하지 않는다. 성공 본문 기대값은 OQ-006 확인 필요다(REQ-043).'
      responses:
        '200':
          description: 'OQ-006: 성공 응답 의미·본문 스키마 확인 필요. JSON 결과 완성을 주장하지 않음.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  schemas:
    ApiResponse:
      type: object
      required: [success, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        meta:
          type: object
          description: 공통 메타데이터. 하위 필드 정책은 미제공이며 requestId·시각을 발명하지 않는다.
          additionalProperties: true
    ApiError:
      type: object
      required: [success, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        meta:
          type: object
          description: 실패 메타데이터. 오류 코드·메시지·추적 필드 정책은 확인 필요다.
          additionalProperties: true
    ScreenAccess:
      type: object
      additionalProperties: false
      required: [scrnId, available, pcOnlyYn]
      properties:
        scrnId:
          type: string
          maxLength: 10
        available:
          type: boolean
          description: False for disabled, invalid-hierarchy, suppressed-ancestor or mixed-group representative menus; viewport filtering remains a client responsibility.
        pcOnlyYn:
          type: string
          enum: ['Y', 'N']
    MenuItem:
      type: object
      additionalProperties: false
      required: [menuId, upperMenuId, menuNm, scrnId, menuLvl, sortOrd, pcOnlyYn, iconNm]
      properties:
        menuId:
          type: string
          maxLength: 20
        upperMenuId:
          type: string
          maxLength: 20
          nullable: true
        menuNm:
          type: string
          maxLength: 50
        scrnId:
          type: string
          maxLength: 10
          nullable: true
        menuLvl:
          type: integer
          description: MENU_LVL NUMERIC(1)의 공개 값
        sortOrd:
          type: integer
          description: SORT_ORD NUMERIC(5)의 공개 값
        pcOnlyYn:
          type: string
          enum: ['Y', 'N']
        iconNm:
          type: string
          maxLength: 30
          nullable: true
