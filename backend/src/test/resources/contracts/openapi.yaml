components:
  schemas:
    CommonDashboardSummary:
      type: object
      required:
      - revenue
      - revenuePreviousComparison
      - revenueTargetRate
      - operatingProfit
      - operatingProfitRate
      - operatingProfitPreviousComparison
      - cumulativeOperatingProfit
      - cumulativeAchievementRate
      - utilizationRate
      - utilizationTargetRate
      - idlePeople
      - unpaidAmount
      - unpaidCount
      - overdueCount
      - overdueAmount
      properties:
        revenue:
          type: number
          description: 선택월 매출; operatingprofitstatements 재사용
          nullable: true
        revenuePreviousComparison:
          type: number
          description: 매출 전월 대비; 기존 원천 단위 유지
          nullable: true
        revenueTargetRate:
          type: number
          description: 목표 대비 매출 비율
          nullable: true
        operatingProfit:
          type: number
          description: 선택월 영업이익
          nullable: true
        operatingProfitRate:
          type: number
          description: 선택월 영업이익률; 영업이익표 「영업이익률」 줄 값
          nullable: true
        operatingProfitPreviousComparison:
          type: number
          description: 영업이익 전월 대비; 원천 단위 유지
          nullable: true
        cumulativeOperatingProfit:
          type: number
          description: 선택월까지 누계 영업이익
          nullable: true
        cumulativeAchievementRate:
          type: number
          description: UI-18 식-36 누계 영업이익 달성률과 동일
          nullable: true
        utilizationRate:
          type: number
          description: DB 식-37 가동률; 전체=직접 인력
          nullable: true
        utilizationTargetRate:
          type: number
          description: 목표 90%; 운영기준 원천 유지
          nullable: true
        idlePeople:
          type: integer
          description: 인력 운영 보드 「지금 비어 있는 인원」(이번 달, 휴직·퇴사·입사 전 제외)
          minimum: 0
        unpaidAmount:
          type: number
          description: 오늘 기준 미수 잔액; 메뉴 배지(unpaid-count)와 같은 조건의 모든 해 청구(식-06)
          nullable: true
        unpaidCount:
          type: integer
          description: 미수가 남은 청구 건수; /api/common/bills/unpaid-count와 같은 값
          minimum: 0
        overdueCount:
          type: integer
          description: 오늘 기준 연체 건수; 청구 상태 LATE
          minimum: 0
        overdueAmount:
          type: number
          description: 오늘 기준 연체 청구의 남은 미수 잔액
          nullable: true
      description: 다섯 카드의 readonly 숫자. nullable은 기존 원천의 분모0/누락 규칙을 보존하며 임의0 대체를 승인하지 않는다(OQ-CALC-016).
    CommonDashboardTodo:
      type: object
      required:
      - key
      - title
      - count
      - description
      - amount
      - targetScreenId
      - targetScreenName
      - tone
      - urgent
      - alwaysVisible
      - visible
      properties:
        key:
          type: string
          description: 줄 구분(시안 순서)
          enum:
          - overdueBills
          - taxPayment
          - cashShortage
          - manpowerShortage
          - overAllocated
          - preContract
          - withdrawal
          - riskProjects
          - overdueIssues
          - billingMissing
          - pendingQuotes
          - staleProjects
          - unassignedSalesPart
        title:
          type: string
          description: 시안 제목(건수 포함, 예 「미수 연체 2건」·「2026-12 자금 부족 예상」)
        count:
          type: integer
          description: 해당 조건 건수
          minimum: 0
        description:
          type: string
          description: 시안 설명 줄(금액은 시안 kor 형식, 프로젝트 이름 등)
        amount:
          type: number
          description: 설명 줄의 금액 원값(연체·자금·청구 누락), 없으면 null
          nullable: true
        targetScreenId:
          type: string
          description: 이동 화면
          nullable: true
        targetScreenName:
          type: string
          description: 이동 화면 이름(시안 「청구·입금 ›」)
          nullable: true
        tone:
          type: string
          description: 시안 색
          enum:
          - bad
          - warn
        urgent:
          type: boolean
          description: tone이 bad이고 건수가 있으면 true(급함 n건)
        alwaysVisible:
          type: boolean
          description: 0건이어도 보이는 줄(철수 예정)
        visible:
          type: boolean
          description: 화면에 그릴 줄(0건 줄은 false, 시안 filter(Boolean))
    CommonDashboardClosingItem:
      type: object
      required:
      - name
      - status
      - description
      - targetScreenId
      properties:
        name:
          type: string
          description: 남은 점검 항목 이름
        status:
          type: string
          description: 월 마감 점검 상태 표시
          nullable: true
        description:
          type: string
          description: 월 마감 점검 한 줄 설명(시안 cl 회색 글자)
          nullable: true
        targetScreenId:
          type: string
          description: 월 마감 점검의 이동 화면
          nullable: true
    CommonDashboardAlertBadge:
      type: object
      required:
      - name
      - tone
      properties:
        name:
          type: string
          description: 경보 이름
        tone:
          type: string
          description: 예산 초과는 bad, 나머지는 warn
          enum:
          - bad
          - warn
    CommonDashboardClosing:
      type: object
      required:
      - completedCount
      - totalCount
      - remainingItems
      properties:
        completedCount:
          type: integer
          description: 선택월 점검 완료 수
          minimum: 0
        totalCount:
          type: integer
