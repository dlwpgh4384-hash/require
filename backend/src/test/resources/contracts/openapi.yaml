components:
  schemas:
    ApiResponse:
      type: object
      required: [success, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        meta:
          type: object
          description: 공통 메타데이터. 하위 필드 정책은 미제공이며 requestId·시각을 발명하지 않는다.
          additionalProperties: true
    ApiError:
      type: object
      required: [success, meta]
      properties:
        message:
          type: string
          description: 사용자에게 보여 줄 존댓말 오류. 내부 코드·영문 오류는 표시하지 않는다.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        success:
          type: boolean
          enum: [false]
        meta:
          type: object
          description: 실패 메타데이터. 오류 코드·메시지·추적 필드 정책은 확인 필요다.
          additionalProperties: true
    UserPreferenceInput:
      type: object
      additionalProperties: false
      required:
      - prefVal
      - modDttm
      properties:
        prefVal:
          type: string
          minLength: 1
          maxLength: 2000
          description: 종류별 직렬화는 데이터 계약 참조. PAGE_SIZE=20/50/100, DENSE=넓게/좁게, MENU_FOLD=true/false. FAV/RECENT는 SCRN_ID
            배열 JSON, PERIOD는 year/month JSON.
        modDttm:
          type: string
          format: date-time
          nullable: true
          description: 조회한 MOD_DTTM. 기존 null 시각 또는 행 부재이면 null을 그대로 전달한다.
    UserPreferenceResult:
      type: object
      additionalProperties: false
      required:
      - prefTypeCd
      - prefKey
      - found
      - prefVal
      - modDttm
      properties:
        prefTypeCd:
          type: string
          enum:
          - FAV
          - RECENT
          - MENU_FOLD
          - PAGE_SIZE
          - DENSE
          - PERIOD
        prefKey:
          type: string
          maxLength: 30
        found:
          type: boolean
          description: 저장 행 존재 여부. 행 없으면 prefVal·modDttm은 null이다.
        prefVal:
          type: string
          nullable: true
          maxLength: 2000
        modDttm:
          type: string
          nullable: true
          format: date-time
    UserPreferenceResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/UserPreferenceResult'
    MenuItem:
      type: object
      additionalProperties: false
      required: [menuId, upperMenuId, menuNm, scrnId, menuLvl, sortOrd, pcOnlyYn, iconNm]
      properties:
        menuId:
          type: string
          maxLength: 20
        upperMenuId:
          type: string
          maxLength: 20
          nullable: true
        menuNm:
          type: string
          maxLength: 50
        scrnId:
          type: string
          maxLength: 10
          nullable: true
        menuLvl:
          type: integer
          description: MENU_LVL NUMERIC(1)의 공개 값
        sortOrd:
          type: integer
          description: SORT_ORD NUMERIC(5)의 공개 값
        pcOnlyYn:
          type: string
          enum: ['Y', 'N']
        iconNm:
          type: string
          maxLength: 30
          nullable: true
