      - 'REQ-592: 선택 연도와 프로젝트 수행 기간이 겹친 경우만 비교하며 수행 상태로 추가 제외하지 않는다.'
      - 'REQ-589: 계획 직무 ∪ 투입 직무를 행으로 만들고 계획 없는 양수투입은 계획0·초과, 투입 없는 양수계획은 실제0·부족이며 합계에 포함한다.'
      - 'REQ-591: 차이=actualMm-plannedMm; <0 부족, >0 초과, =0 맞음. 허용 오차를 두지 않는다.'
      - 'REQ-593: 연도 몫은 UI-01 원계획×연도겹침개월/전체개월이며 소수 둘째 자리 반올림, 시안 가짜값 사용 금지다.'
      x-side-effects:
      - 'REQ-596: TB_PJ_MNPW_PLAN·TB_PJ_ASGN_MON 업무 쓰기 없음; 조회 결과를 물리 표로 저장하지 않는다.'
      x-required-tests:
      - 'happy: 연도겹침 프로젝트의 계획/투입 직무가 다른 fixture로 year=2026 조회 -> 200 data.items에 두 직무 모두 있고 누락 MM은0이며 data.totals는 같은 결과의 합이다.'
      - 'auth: 인증 헤더 없이 유효 year로 조회 -> 200 success=true·meta·data.items가 반환되고 로그인 이동/401/403은 없다.'
      - 'validation: year 누락 또는 2025~2027 밖, differenceStatus가 세 상태 밖인 요청 -> 400 ApiError.errors에 year 또는 differenceStatus 필드 오류가 있다.'
      - 'business: 월 MM의 실제/예정과 다른 연도 자료가 있는 fixture 조회 -> actualMm은 선택 연도 1~12월 합이고 다른 연도는 제외되며 차이0만 맞음이다.'
      - 'side-effect: 정상/0건 조회 전후 원천 snapshot 비교 -> TB_PJ_MNPW_PLAN·TB_PJ_ASGN_MON 행과 값이 같고 비교결과 저장행이 생성되지 않는다.'
      - 'scope: 선택 연도와 수행 기간이 겹치지 않는 프로젝트를 가진 fixture 조회 -> 해당 projectId는 items에 없고 합계에도 포함되지 않는다.'
      - 'annual-plan: UI-01 원계획·여러해 수행기간·확보된 DB식 fixture 조회 -> plannedMm이 그 해 개월비율 안분의 소수 둘째 자리 반올림과 같다; 미제공 절대수치는 OQ-CALC-011이다.'
      - 'empty: 조건 일치0건 조회 -> 200 data.items=[]이고 세 totals MM이0이다; 오류를 정상 빈 결과로 바꾸지 않는다.'
      parameters:
