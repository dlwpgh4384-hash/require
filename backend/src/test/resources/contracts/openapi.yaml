openapi: 3.0.3
info:
  title: 공통 화면 틀 메뉴 계약
  version: 0.1.0
  description: >-
    spec.md와 requirement-registry.json을 기준으로 원문 식별자와 요구 의미를 보존한다.
    getCommonMenus·getHealth 및 GET /api/health는 기존 설계 제안이다.
    아래 메뉴 성공 봉투는 현재 생성 지시를 따르지만 원문 최상위 배열과의 충돌 OQ-002를
    해결한 사용자 승인으로 취급하지 않는다. 직접 진입 정보 전달 OQ-005,
    health 결과·오류 OQ-006, 페이지·검색 입력과 호출자 오류 OQ-007은 확인 필요다.
    원장 REQ-044의 출처 불일치 UP-001도 보존한다. 완성된 실행 계약이나 구현 성공을 주장하지 않는다.
security: []
x-design-status: clarification_required
x-test-status: not_run
x-open-questions:
  - 'OQ-001: Java21/Boot3.5.x와 고정 Java17/Boot3.3.x 충돌 해소 승인 없음.'
  - 'OQ-002: 원문 최상위 메뉴 배열·[]와 ApiResponse 봉투의 충돌 보존. data 배열로 변경하는 원문 계약 승인은 별도 확인 필요.'
  - 'OQ-003: 휴대폰 폭 수치는 원문 미제공. cost의767px 이하는 설계 제안이며 사용자 승인 수치가 아님.'
  - 'OQ-004: /screens/{scrnId}·getCommonMenus는 구현 명칭 제안이며 원문 확정 이름으로 가장하지 않음.'
  - 'OQ-005: 필터된 메뉴 목록만으로 미등록과 숨김 화면을 구분할 수 없음. 판별 정보 전달 방식과 혼합 메뉴 SCRN_ID 직접 진입 취급 확인 필요.'
  - 'OQ-006: /api/health 성공 값·본문·DB 포함 여부·실패 조건·호출자 오류 및 4xx 부재 근거 확인 필요. 빈 결과 객체나 면제 근거를 발명하지 않음.'
  - 'OQ-007: 전체 계층 GET의 검색·페이지 입력·호출자 입력 검증·4xx가 원문에 없음. pagination/filtering 및 오류 계약을 임의 확정하지 않음.'
  - 'OQ-008: schema/migration 도구·실행 명령 확인 필요.'
  - 'OQ-009: 기존 SQ_TB_SY_NOTI 값 변경·초기화 정책 확인 필요.'
  - 'OQ-010: 기존 구조 차이 보고 방식·확인 절차 형식 확인 필요.'
paths:
  /api/common/menus:
    get:
      operationId: getCommonMenus
      summary: 사용 메뉴 계층 조회
      description: >-
        실제 PostgreSQL TB_SY_MENU만 읽는다. 전체 관계에서 중복 대표와 계층을 판정한 뒤
        사용 메뉴를 반환한다. PC_ONLY_YN의 폭 필터와 최종 빈 그룹 숨김은 브라우저 책임이다.
        개발 PC에서 인증 없이 호출하며 localhost 제한은 배포 연결 경계다.
        요청 검색·페이지 입력과 호출자 정정 가능한 오류는 원문에 정의되지 않았다.
        4xx를 발명하거나 업무 읽기를 인프라 예외로 위장하지 않는다(OQ-007).
        GET은 DDL·seed·화면 상태 저장을 실행하지 않는다.
