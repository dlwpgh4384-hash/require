# 내 PC 메일 설정 예시. 이 파일을 같은 폴더에 application-local.yml로 복사해 값을 넣는다(그 파일은 git에 안 올림).
# 앱이 도는 곳 옆 config/application-local.yml을 읽는다. 환경 변수 SMTP_HOST·SMTP_PORT·SMTP_USERNAME·SMTP_PASSWORD가 있으면 그것이 먼저다.
# 비밀번호가 비어 있으면 메일을 보내지 않고 서버 임시 폴더 billing-mail에 .eml로 쓴다. 실제 아이디·키는 이 예시에 적지 않는다.
# 주소·포트는 application.yml 기본값(smtp-relay.brevo.com·587)을 쓴다. 바꿀 때만 # 을 지우고 값을 넣는다(빈 칸으로 두면 기본값이 지워진다).
spring:
  mail:
    # host:
    # port:
    username:
    password:
billing:
  mail:
    from:
