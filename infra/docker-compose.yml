services:
  database:
    image: postgres:16.8-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navigation}
      POSTGRES_USER: ${DB_USER:-navigation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-password}
    volumes:
      - navigation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: navigation-backend:1.0.0
    pull_policy: build
    build:
      context: ../backend
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-navigation}
      DB_USER: ${DB_USER:-navigation}
      DB_PASSWORD: ${DB_PASSWORD:-dev-only-password}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health | tr -d '[:space:]' | grep -q '\"success\":true'"]
      interval: 10s
      timeout: 3s
      retries: 12
  frontend:
    image: navigation-frontend:1.0.0
    pull_policy: build
    build:
      context: ../frontend
      target: runtime
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  navigation-data:
